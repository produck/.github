name: Verify Agent Toolkit

on:
  workflow_dispatch:

jobs:
  verify-toolkit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: tools/agent-toolkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify CLI
        run: npm run verify

      - name: Pack dry-run
        run: npm run pack:check

      - name: Publish dry-run
        run: npm run publish:dry-run
